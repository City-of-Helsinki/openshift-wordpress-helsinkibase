# Normalize Azure Application Gateway X-Forwarded-For values by removing the source port.
RequestHeader edit X-Forwarded-For "^([0-9.]+):[0-9]+$" "$1" early

# Derive the effective client address from the X-Forwarded-For header.
RemoteIPHeader X-Forwarded-For

# Trust X-Forwarded-For values received from the OpenShift pod network.
RemoteIPInternalProxy 10.128.0.0/14
